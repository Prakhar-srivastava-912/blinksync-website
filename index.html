<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060d1b" />
    <meta
      name="description"
      content="BlinkSync is a privacy-first AI eye-care companion that tracks blinking with on-device computer vision, guides 20-20-20 breaks, and shows your eye activity analytics."
    />
    <title>BlinkSync — Your AI-Powered Eye Care Companion</title>
    <script>
      // Apply the saved theme before first paint to avoid a bright flash.
      try {
        var raw = localStorage.getItem('blinksync.settings.v1');
        var theme = raw ? JSON.parse(raw).theme : 'dark';
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
